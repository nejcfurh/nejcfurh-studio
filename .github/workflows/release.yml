name: Generate Release Tag and Sync Main Branch to Develop Branch

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Calculate new version
        id: new_version
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A merged release PR always ships: with no feat or fix it is a patch.
          .github/scripts/release.sh version "$PR_HEAD_SHA" patch | tee -a "$GITHUB_OUTPUT"

      - name: Update package.json version
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.next_version }}"
          npm version $NEW_VERSION --no-git-tag-version
          echo "Updated package.json to version $NEW_VERSION"

      - name: Generate CHANGELOG
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          LATEST_TAG="${{ steps.new_version.outputs.latest_tag }}"
          NEW_TAG="v${{ steps.new_version.outputs.next_version }}"

          {
            echo "## $NEW_TAG ($(date +%Y-%m-%d))"
            echo ""
            .github/scripts/release.sh notes "$LATEST_TAG" "$PR_HEAD_SHA"
          } > /tmp/release-notes.md

          .github/scripts/release.sh changelog CHANGELOG.md /tmp/release-notes.md

      - name: Commit version bump and changelog
        run: |
          NEW_TAG="v${{ steps.new_version.outputs.next_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json CHANGELOG.md
          git commit -m "chore: release $NEW_TAG [skip ci]"
          git push origin main

      - name: Create Git Tag
        run: |
          NEW_TAG="v${{ steps.new_version.outputs.next_version }}"
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="v${{ steps.new_version.outputs.next_version }}"
          gh release create $NEW_TAG \
            --title "Release $NEW_TAG" \
            --notes-file /tmp/release-notes.md

      - name: Sync main to develop
        run: |
          echo "Syncing main branch back to develop..."
          git fetch origin develop
          git checkout develop

          # Try fast-forward merge first (no merge commit if possible)
          if git merge origin/main --ff-only 2>/dev/null; then
            echo "Fast-forward merge successful (no merge commit created)"
          else
            echo "Fast-forward not possible, performing regular merge..."
            git merge origin/main --no-edit
          fi

          git push origin develop
          echo "Successfully synced main to develop"
