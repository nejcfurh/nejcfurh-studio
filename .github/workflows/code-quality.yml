name: Code Quality Checks

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Prettier
        run: pnpm lint:prettier

      - name: Run ESLint
        run: pnpm lint:eslint

      - name: Run Type Check
        run: pnpm type:check

      - name: Run Tests
        run: pnpm test

      # The apps validate their env at build time. CI has no secrets, so these
      # placeholders only satisfy the schemas; nothing connects to them.
      # domavia is left out: firebase-admin parses FIREBASE_PRIVATE_KEY at import
      # time and needs a real PEM, which would have to come from an Actions secret.
      - name: Run Build
        run: pnpm build --filter='!domavia'
        env:
          NEXT_PUBLIC_ENV: development
          NEXT_PUBLIC_ROOT_URL: https://ci.example.invalid
          NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://ci.example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci.example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_PUSHER_APP_KEY: ci-placeholder
          PUSHER_APP_ID: '1'
          PUSHER_SECRET: ci-placeholder
          MONGODB_URI: mongodb://localhost:1/ci
          DATABASE_URL: postgresql://localhost:1/ci
          AUTH_URL: https://ci.example.invalid
          AUTH_SECRET: ci-placeholder
          NEXTAUTH_SECRET: ci-placeholder
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder
          AUTH_GITHUB_ID: ci-placeholder
          AUTH_GITHUB_SECRET: ci-placeholder
          AUTH_FACEBOOK_ID: ci-placeholder
          AUTH_FACEBOOK_SECRET: ci-placeholder
          AUTH_TWITTER_ID: ci-placeholder
          AUTH_TWITTER_SECRET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ci-placeholder
          FIREBASE_PROJECT_ID: ci-placeholder
          FIREBASE_CLIENT_EMAIL: ci@example.invalid
          FIREBASE_PRIVATE_KEY: ci-placeholder
          NEXT_PUBLIC_CONVEX_URL: https://ci.example.invalid
          CONVEX_DEPLOYMENT: ci-placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: ci-placeholder
          CLERK_WEBHOOK_SECRET: ci-placeholder
          GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
          LOCATIONIQ_GEOCODE_API_KEY: ci-placeholder
          ADMIN_USERNAME: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
          USER_ELYSANTIUM: ci-placeholder
          PASSWORD_ELYSANTIUM: ci-placeholder
